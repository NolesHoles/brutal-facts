# Brutal Facts globe: Netlify settings.
# Needs a Git-connected site or `netlify deploy --build`. Drag-and-drop uploads skip the
# build step and the function, so the site would fall back to the static data file.
[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
